<!DOCTYPE html>
<html>
<head>
    <title>موقعي الأول!</title>

        <td>السبت</td>
        <td>بيض</td>

<!-- زر يغير الكلام -->

<button>اضغط هنا</button>

<!-- نهاية الموقع -->
